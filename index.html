<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Deni — admin dashboard template built with OpenVue." />
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="OpenVue" />
        <meta property="og:title" content="Deni — OpenVue admin dashboard template" />
        <meta property="og:description" content="A full-featured admin dashboard template for OpenVue, built with Vite, Vue 3 and TypeScript." />
        <meta name="twitter:card" content="summary" />
        <title>Deni</title>
        <script>
            (function () {
                var root = document.documentElement;
                var scheme = 'light';
                try {
                    var stored = JSON.parse(localStorage.getItem('deni-preferences') || '{}');
                    scheme = stored.scheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                } catch (e) {}
                if (scheme !== 'light') root.classList.add('app-dark');
                if (scheme === 'dim') root.classList.add('app-dim');
            })();
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
